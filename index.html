<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Flash - Target Reaction Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #1e293b;
            padding: 16px;
        }
        .header-container {
            max-width: 1024px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #2dd4bf);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #020617;
        }
        .title-text h1 {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }
        .title-text p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Main Section */
        main {
            flex: 1;
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 768px) {
            .scoreboard {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .score-card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-val-box {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-top: 6px;
        }
        .card-val {
            font-size: 28px;
            font-weight: 800;
        }
        .unit {
            font-size: 12px;
            color: #64748b;
        }

        /* Game Arena */
        .arena-container {
            position: relative;
            width: 100%;
            height: 440px;
            background-color: #0f172a;
            border-radius: 24px;
            border: 2px solid #1e293b;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: 24px 24px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        /* Overlay & Start Button */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .overlay.hidden {
            display: none !important;
        }

        .start-btn {
            background-color: #10b981 !important;
            color: #020617 !important;
            font-weight: 800 !important;
            font-size: 18px !important;
            padding: 14px 36px !important;
            border-radius: 16px !important;
            border: none !important;
            cursor: pointer !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.7) !important;
            transition: all 0.2s ease !important;
        }
        .start-btn:hover {
            background-color: #34d399 !important;
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.9) !important;
        }
        .start-btn:active {
            transform: scale(0.96);
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .overlay-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .overlay-desc {
            font-size: 14px;
            color: #cbd5e1;
            max-width: 420px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Helper Classes */
        .hidden { display: none !important; }
        .text-emerald { color: #34d399; }
        .text-amber { color: #fbbf24; }
        .text-teal { color: #2dd4bf; }

        .hint-badge {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            border-radius: 9999px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #1e293b;
            font-size: 12px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 10;
        }

        .shake-effect {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        footer {
            border-top: 1px solid #0f172a;
            background: #020617;
            padding: 16px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-box">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                </div>
                <div class="title-text">
                    <h1>Precision Flash</h1>
                    <p>Reaction Speed Test</p>
                </div>
            </div>
            <button id="soundToggle" style="background:#1e293b; border:1px solid #334155; color:#cbd5e1; padding:8px 12px; border-radius:10px; cursor:pointer;">🔊 Sound</button>
        </div>
    </header>

    <!-- Main Section -->
    <main>
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-card">
                <span class="card-label">Level</span>
                <div class="card-val-box">
                    <span id="levelDisplay" class="card-val text-emerald">1</span>
                    <span class="unit">Stage</span>
                </div>
            </div>
            <div class="score-card">
                <span class="card-label">Time Limit</span>
                <div class="card-val-box">
                    <span id="timerDisplay" class="card-val" style="color:#fff;">10.00</span>
                    <span class="unit">sec</span>
                </div>
            </div>
            <div class="score-card">
                <span class="card-label">High Score</span>
                <div class="card-val-box">
                    <span id="highScoreDisplay" class="card-val text-amber">0</span>
                    <span class="unit">Lvl</span>
                </div>
            </div>
            <div class="score-card">
                <span class="card-label">Target Size</span>
                <div class="card-val-box">
                    <span id="targetSizeDisplay" class="card-val text-teal">50</span>
                    <span class="unit">px</span>
                </div>
            </div>
        </div>

        <!-- Game Arena -->
        <div id="arenaBox" class="arena-container">
            
            <!-- Start Overlay -->
            <div id="startOverlay" class="overlay">
                <div class="icon-circle">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
                </div>
                <h2 id="overlayTitle" class="overlay-title">Ready to Test Your Speed?</h2>
                <p id="overlayText" class="overlay-desc">
                    초록색 동그라미 표적을 최대한 빠르게 클릭하세요!<br/>방해 도형이나 빈 배경을 누르면 게임 오버됩니다.
                </p>
                <button id="startBtn" type="button" class="start-btn">
                    Start Game
                </button>
            </div>

            <div id="failFlash" style="position:absolute; inset:0; background:rgba(220,38,38,0.3); opacity:0; pointer-events:none; transition:opacity 0.15s; z-10"></div>
            <div id="gamePlayArea" style="position:absolute; inset:0;" class="hidden"></div>
            <div id="gameHint" class="hint-badge">Wait for green target circle...</div>
        </div>
    </main>

    <footer>
        Precision Flash Reaction Game
    </footer>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) this.ctx = new AudioContextClass();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playSuccess() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
            playFail() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const audio = new SoundEngine();

        let level = 1;
        let baseTime = 10.00;
        let timeRemaining = 10.00;
        let timerInterval = null;
        let gameState = 'IDLE'; 
        let highScore = parseInt(localStorage.getItem('precision_reaction_highscore') || '0', 10);
        let targetSpawnTimeout = null;

        const levelDisplay = document.getElementById('levelDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const targetSizeDisplay = document.getElementById('targetSizeDisplay');
        const arenaBox = document.getElementById('arenaBox');
        const startOverlay = document.getElementById('startOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const gamePlayArea = document.getElementById('gamePlayArea');
        const failFlash = document.getElementById('failFlash');
        const startBtn = document.getElementById('startBtn');
        const gameHint = document.getElementById('gameHint');
        const soundToggle = document.getElementById('soundToggle');

        highScoreDisplay.textContent = highScore;

        soundToggle.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            soundToggle.textContent = audio.enabled ? "🔊 Sound" : "🔇 Mute";
        });

        startBtn.addEventListener('click', () => {
            audio.init();
            startGame();
        });

        function startGame() {
            level = 1;
            baseTime = 10.00;
            updateStatsUI();
            startOverlay.classList.add('hidden');
            gamePlayArea.classList.remove('hidden');
            prepareNextRound();
        }

        function updateStatsUI() {
            levelDisplay.textContent = level;
            highScoreDisplay.textContent = highScore;
            const currentTargetSize = Math.max(18, 52 - (level - 1) * 1.5);
            targetSizeDisplay.textContent = Math.round(currentTargetSize);
        }

        function prepareNextRound() {
            gameState = 'WAITING';
            clearPlayArea();
            gameHint.textContent = '준비하세요... 잠시 후 표적이 등장합니다!';

            const randomDelay = Math.floor(Math.random() * 1100) + 400;
            targetSpawnTimeout = setTimeout(() => {
                if (gameState === 'WAITING') spawnTargetAndDistractors();
            }, randomDelay);
        }

        function clearPlayArea() {
            gamePlayArea.innerHTML = '';
            clearInterval(timerInterval);
        }

        function spawnTargetAndDistractors() {
            gameState = 'ACTIVE';
            gameHint.textContent = '초록색 표적을 누르세요!';

            const containerWidth = arenaBox.clientWidth || 300;
            const containerHeight = arenaBox.clientHeight || 400;

            const targetRadius = Math.max(10, 26 - (level - 1) * 0.75); 
            const targetDiameter = targetRadius * 2;

            const padding = 20;
            const maxX = Math.max(10, containerWidth - targetDiameter - padding);
            const maxY = Math.max(10, containerHeight - targetDiameter - padding);

            const targetX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const targetY = Math.floor(Math.random() * (maxY - padding)) + padding;

            const numDistractors = Math.min(12, Math.floor(level / 2) + 2);
            for (let i = 0; i < numDistractors; i++) {
                spawnDistractorShape(containerWidth, containerHeight, targetX, targetY, targetRadius);
            }

            const targetElem = document.createElement('div');
            targetElem.style.width = `${targetDiameter}px`;
            targetElem.style.height = `${targetDiameter}px`;
            targetElem.style.left = `${targetX}px`;
            targetElem.style.top = `${targetY}px`;
            targetElem.style.position = 'absolute';
            targetElem.style.borderRadius = '50%';
            targetElem.style.background = 'linear-gradient(135deg, #10b981, #34d399)';
            targetElem.style.border = '2px solid #a7f3d0';
            targetElem.style.boxShadow = '0 0 15px rgba(16, 185, 129, 0.8)';
            targetElem.style.cursor = 'pointer';
            targetElem.style.zIndex = '20';

            targetElem.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                handleSuccessHit();
            });

            gamePlayArea.appendChild(targetElem);

            timeRemaining = Math.max(0.5, baseTime - (level - 1) * 0.01);
            timerDisplay.textContent = timeRemaining.toFixed(2);
            
            const startTime = performance.now();
            const totalAllowed = timeRemaining * 1000;

            timerInterval = setInterval(() => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, (totalAllowed - elapsed) / 1000);
                timerDisplay.textContent = remaining.toFixed(2);

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    triggerFail('시간 초과!');
                }
            }, 10);
        }

        function spawnDistractorShape(width, height, targetX, targetY, targetRadius) {
            const distSize = Math.floor(Math.random() * 24) + 24;

            let x, y;
            let attempts = 0;
            do {
                x = Math.floor(Math.random() * Math.max(10, width - distSize - 30)) + 15;
                y = Math.floor(Math.random() * Math.max(10, height - distSize - 30)) + 15;
                attempts++;
            } while (
                Math.hypot((x + distSize/2) - (targetX + targetRadius), (y + distSize/2) - (targetY + targetRadius)) < (targetRadius + distSize/2 + 20)
                && attempts < 15
            );

            const distElem = document.createElement('div');
            distElem.style.width = `${distSize}px`;
            distElem.style.height = `${distSize}px`;
            distElem.style.left = `${x}px`;
            distElem.style.top = `${y}px`;
            distElem.style.position = 'absolute';
            distElem.style.borderRadius = '8px';
            distElem.style.background = '#ef4444';
            distElem.style.cursor = 'pointer';
            distElem.style.zIndex = '10';

            distElem.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                triggerFail('잘못된 도형 클릭!');
            });

            gamePlayArea.appendChild(distElem);
        }

        gamePlayArea.addEventListener('pointerdown', (e) => {
            if (gameState === 'ACTIVE') {
                triggerFail('표적 놓침!');
            }
        });

        function handleSuccessHit() {
            if (gameState !== 'ACTIVE') return;
            clearInterval(timerInterval);
            audio.playSuccess();

            level++;
            if (level - 1 > highScore) {
                highScore = level - 1;
                localStorage.setItem('precision_reaction_highscore', highScore.toString());
            }

            updateStatsUI();
            prepareNextRound();
        }

        function triggerFail(reasonMessage = '실패!') {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            clearInterval(timerInterval);
            clearTimeout(targetSpawnTimeout);
            audio.playFail();

            failFlash.style.opacity = '1';
            arenaBox.classList.add('shake-effect');
            setTimeout(() => {
                failFlash.style.opacity = '0';
                arenaBox.classList.remove('shake-effect');
            }, 300);

            const finalReachedStage = Math.max(1, level);
            overlayTitle.textContent = reasonMessage;
            overlayText.innerHTML = `게임 오버! 도달한 최고 단계: <strong style="color:#34d399">${finalReachedStage} Stage</strong><br/>최고 기록: <strong style="color:#fbbf24">${highScore} Level</strong>`;
            startBtn.textContent = 'Try Again';
            
            setTimeout(() => {
                gamePlayArea.classList.add('hidden');
                startOverlay.classList.remove('hidden');
            }, 400);
        }
    </script>
</body>
</html>
